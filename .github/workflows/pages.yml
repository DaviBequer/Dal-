name: Publicar no GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versão
        id: versao
        run: |
          V=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" version.js)
          test -n "$V" || { echo "::error::Versão não encontrada em version.js"; exit 1; }
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          echo "Versão: $V"

      - name: Conferir se a versão foi aumentada
        id: conferir
        env:
          V: ${{ steps.versao.outputs.versao }}
        run: |
          APP="index.html styles.css app.js sw.js version.js manifest.webmanifest icons"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            if git diff --quiet "v$V" HEAD -- $APP; then
              echo "App sem mudanças desde v$V; republica sem criar tag."
              echo "nova=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::O app mudou mas a versão continua $V. Aumente APP_VERSION em version.js e atualize o CHANGELOG.md."
              exit 1
            fi
          else
            echo "nova=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar na branch gh-pages
        env:
          V: ${{ steps.versao.outputs.versao }}
        run: |
          mkdir _site
          cp -r index.html styles.css app.js sw.js version.js manifest.webmanifest icons _site/
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publica versão $V (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Pedir build do Pages e conferir o site no ar
        env:
          V: ${{ steps.versao.outputs.versao }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Não foi possível pedir o build (segue conferindo)."
          URL="https://${OWNER,,}.github.io/${{ github.event.repository.name }}/"
          for i in $(seq 1 40); do
            GOT=$(curl -fsS "${URL}version.js?t=$(date +%s)" 2>/dev/null | sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p") || true
            if [ "$GOT" = "$V" ]; then
              echo "Site no ar: $URL (versão $V)"
              exit 0
            fi
            echo "Aguardando… (site responde: '${GOT:-nada}')"
            sleep 15
          done
          gh api "repos/${{ github.repository }}/pages" || true
          echo "::error::O site $URL não mostrou a versão $V a tempo."
          exit 1

      - name: Criar tag da versão
        if: steps.conferir.outputs.nova == 'true'
        env:
          V: ${{ steps.versao.outputs.versao }}
        run: |
          git tag "v$V"
          git push origin "v$V"
