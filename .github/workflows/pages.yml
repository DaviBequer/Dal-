name: Publicar no GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versão
        id: versao
        run: |
          V=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" version.js)
          test -n "$V" || { echo "::error::Versão não encontrada em version.js"; exit 1; }
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          echo "Versão: $V"

      - name: Conferir se a versão foi aumentada
        id: conferir
        env:
          V: ${{ steps.versao.outputs.versao }}
        run: |
          APP="index.html styles.css app.js sw.js version.js manifest.webmanifest icons"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            if git diff --quiet "v$V" HEAD -- $APP; then
              echo "App sem mudanças desde v$V; republica sem criar tag."
              echo "nova=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::O app mudou mas a versão continua $V. Aumente APP_VERSION em version.js e atualize o CHANGELOG.md."
              exit 1
            fi
          else
            echo "nova=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Montar o site
        run: |
          mkdir _site
          cp -r index.html styles.css app.js sw.js version.js manifest.webmanifest icons _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Criar tag da versão
        if: steps.conferir.outputs.nova == 'true'
        env:
          V: ${{ steps.versao.outputs.versao }}
        run: |
          git tag "v$V"
          git push origin "v$V"
