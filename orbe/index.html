<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbe mudou de endereço</title>
<meta http-equiv="refresh" content="0; url=https://davibequer.github.io/orbe/">
<script>
  // O Orbe agora tem endereço próprio. Remove o app antigo deste caminho e leva para o novo.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => { if (r.scope.endsWith('/orbe/')) r.unregister(); }));
  location.replace('https://davibequer.github.io/orbe/');
</script>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#111214;color:#fff}a{color:#7FC7D6}</style>
</head>
<body><p>O Orbe mudou para <a href="https://davibequer.github.io/orbe/">davibequer.github.io/orbe</a></p></body>
</html>
